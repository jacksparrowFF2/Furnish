<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>扁桶电热水器 60L · 模型预览</title>
<style>body{margin:0;background:#34485e;color:#fff;font:16px system-ui}header{position:absolute;top:24px;left:32px;z-index:1}h1{font-size:24px;margin:0 0 8px}p{margin:6px 0;color:#d8e0ea}canvas{display:block}#error{position:absolute;bottom:20px;left:32px}</style>
<header><h1>扁桶电热水器 60L</h1><p>宽 700 × 高 565 × 深 320 mm · 外观近似版</p><p>拖动旋转查看 · 滚轮缩放</p></header><div id="error"></div>
<script src="../src/core/part-identity.js"></script><script src="../src/core/product-rules.js"></script>
<script src="../src/render/model-primitives.js"></script>
<script src="../src/render/appliance-model.js"></script>
<!-- FURNISH_IMPORT_MAP -->
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const models=FurnishApplianceModel.create(THREE,RoundedBoxGeometry);
try{
 const build=models.build;
 const scene=new THREE.Scene();scene.background=new THREE.Color('#34485e');
 const model=build({id:'preview',type:'waterheater_flat',cx:0,cy:0,w:700,d:320,h:565,rot:0,color:'#fafafa'});model.position.y=-1.65;scene.add(model);
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
 scene.add(new THREE.HemisphereLight('#ffffff','#a1adb9',2.4));
 const key=new THREE.DirectionalLight('#ffffff',3);key.position.set(-2,3,4);scene.add(key);
 const fill=new THREE.DirectionalLight('#dce6ff',1.2);fill.position.set(3,1,2);scene.add(fill);
 const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,20);camera.position.set(.95,.62,1.45);
 const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.29,0);controls.update();
 function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}resize();addEventListener('resize',resize);
 function draw(){requestAnimationFrame(draw);controls.update();renderer.render(scene,camera);}draw();
 window.previewReady=true;
}catch(e){document.querySelector('#error').textContent=e.message;}
</script></html>
