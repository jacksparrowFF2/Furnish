<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Furnish · 窗饰模型对照</title>
<style>*{box-sizing:border-box}body{margin:0;background:#ece8e0;color:#3b3934;font:14px system-ui}header,footer{padding:20px 28px}h1{margin:3px 0 8px;font-size:26px}p{margin:7px 0;color:#706a60}button,select{padding:6px 10px;border:1px solid #c8c1b5;background:#fffdf8;border-radius:6px;color:inherit}button{cursor:pointer}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:0 28px}article{background:#f9f6ef;border:1px solid #d6cfc2;border-radius:12px;overflow:hidden}article h2{font-size:17px;margin:14px 18px 4px}.view{height:290px}canvas{display:block;width:100%;height:100%}.tools{display:flex;gap:7px;flex-wrap:wrap;padding:10px 16px 16px}.tools label{font-size:12px;display:flex;align-items:center;gap:4px}footer{font-size:12px}#status{float:right}@media(max-width:850px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{grid-template-columns:1fr}}</style>
<header><span id="status" role="status">正在加载生产模型…</span><small>FURNISH / WINDOW COVERINGS</small><h1>窗饰 · 六种新增模型</h1><p>纱帘、百叶、蜂巢、日夜柔纱、竹帘和卷帘。通用定制模型，尺寸及构造为布局假设；原有不透光布帘继续保留。</p><button id="lower-all">全部展开</button> <button id="raise-all">全部收起</button></header><main></main><footer>模型与 Furnish 正式生产构造器共用；收起比例、百叶角度和日夜模式可在家具属性中保存。透明度为实时视觉近似，不是透光率或遮光等级。</footer>
<!--IMPORTMAP-->
<script src="../../src/core/part-identity.js"></script><script src="../../src/core/product-rules.js"></script><script src="../../src/render/model-primitives.js"></script><script src="../../src/render/window-covering-model.js"></script>
<script type="module">
import * as T from 'three';
const specs=[['curtain_sheer','半透光纱帘','#f5f0e5'],['blind_venetian','百叶帘','#d5c9b8'],['blind_honeycomb','蜂巢帘','#e4d5bc'],['blind_zebra','日夜柔纱帘 · 斑马帘','#cab596'],['blind_bamboo','竹帘','#9b7547'],['blind_roller','卷帘','#cec7b9']],renders=[];
for(const [type,label,color]of specs){
 const card=document.createElement('article');card.innerHTML=`<h2>${label}</h2><div class="view"></div><div class="tools"><label>收起 <select aria-label="${label}收起比例"><option value="0">0%</option><option value="0.5">50%</option><option value="1">100%</option></select></label>${type==='blind_venetian'?'<label>叶片 <select aria-label="百叶角度"><option value="85">85° 近闭合</option><option value="45">45°</option><option value="0">0° 水平</option></select></label>':''}${type==='blind_zebra'?'<label>调光 <select aria-label="柔纱调光"><option value="day">日间</option><option value="night">夜间</option></select></label>':''}</div>`;document.querySelector('main').append(card);
 const view=card.querySelector('.view'),renderer=new T.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));view.append(renderer.domElement);renderer.toneMapping=T.ACESFilmicToneMapping;
 const scene=new T.Scene(),camera=new T.PerspectiveCamera(35,1,.01,20);camera.position.set(.32,.98,3.75);camera.lookAt(0,.88,0);scene.add(new T.HemisphereLight('#fffaf1','#807461',2.2));const light=new T.DirectionalLight('#fff7ea',3);light.position.set(-2,4,4);scene.add(light);
 const pane=new T.Mesh(new T.PlaneGeometry(1.44,1.72),new T.MeshStandardMaterial({color:'#759ba5',roughness:1}));pane.position.set(0,.9,-.12);scene.add(pane);
 for(const [w,h,x,y]of [[1.5,.025,0,.025],[1.5,.025,0,1.775],[.025,1.8,-.74,.9],[.025,1.8,.74,.9],[.025,1.7,0,.9],[1.5,.025,0,.9]]){const bar=new T.Mesh(new T.BoxGeometry(w,h,.025),new T.MeshStandardMaterial({color:'#f7f3e9'}));bar.position.set(x,y,-.1);scene.add(bar);}
 const f={id:type,type,cx:0,cy:0,w:1500,d:75,h:1800,rot:0,color,...FurnishProducts.initial({type})};let model;
 const render=()=>{if(model){scene.remove(model);model.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});}model=FurnishWindowCoveringModel.build(T,f);scene.add(model);renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);};
 const selects=card.querySelectorAll('select');selects[0].onchange=e=>{f.curtainOpen=Number(e.target.value);render();};if(type==='blind_venetian')selects[1].onchange=e=>{f.blindAngle=Number(e.target.value);render();};if(type==='blind_zebra')selects[1].onchange=e=>{f.shadeMode=e.target.value;render();};renders.push({render,f,select:selects[0]});render();
}
for(const [id,value]of [['lower-all',0],['raise-all',1]])document.getElementById(id).onclick=()=>{for(const item of renders){item.f.curtainOpen=value;item.select.value=String(value);item.render();}};
window.addEventListener('resize',()=>renders.forEach(r=>r.render()));document.getElementById('status').textContent='6 种生产模型已加载';
</script></html>
