<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>分层餐边柜</title>
<style>body{margin:0;background:#f3eee8;color:#56473d;font:16px system-ui}header,footer{padding:20px 30px}h1{margin:0 0 8px;font-size:25px}p{margin:0;line-height:1.8}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 24px}article{background:#fcfaf7;border-radius:14px;overflow:hidden}h2{font-size:16px;margin:16px 22px}canvas{display:block;width:100%;height:560px}button{padding:8px 16px;margin-right:10px}@media(max-width:750px){main{grid-template-columns:1fr}}</style>
<header><h1>分层餐边柜 · 两种款式</h1><p>下柜 → 台面 → 操作区 → 玻璃展示柜 → 顶部封闭柜<br>未标注深度及展示高度为可调草模尺寸；冰箱另行放置。</p></header><main><article><h2>不含冰箱 · 1980 × 450 × 2430 mm</h2><canvas></canvas></article><article><h2>带左侧冰箱位 · 2156 × 600 × 2400 mm</h2><canvas></canvas></article></main><footer><button id="doors">开合所有柜门</button><button id="upper-doors">开合上柜门</button><button id="lower-doors">开合下柜门</button><button id="display">上翻玻璃展示门</button><button id="front">正面 / 斜视</button><button id="drawers">开合浅抽屉</button><label>浅抽屉高度 mm <input id="drawer-height" type="number" min="60" max="500" step="1" value="140" style="width:85px"></label><label>冰箱位深度 mm <input id="fridge-depth" type="number" min="150" max="1200" value="600" style="width:85px"></label><span id="error" role="alert"></span><p>拖动旋转，滚轮缩放。冰箱位净宽 800、净高 1915 mm；展示柜按相邻两列合并，末尾单列独立。浅抽屉默认 140 mm，调整时台面高度保持不变。暖色灯带为外观表示。</p></footer>
<script src="../../src/core/cabinet-core.js"></script><script src="../../src/core/product-rules.js"></script><script src="../../src/render/cabinet-model.js"></script><!-- FURNISH_IMPORT_MAP --><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const views=[],box=(w,h,d,color,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.72}));m.position.set(x,y+h/2,z);return m;};
for(const [i,canvas] of [...document.querySelectorAll('canvas')].entries()){
 const f={type:'cabinet',...FurnishCabinet.preset(i?'sideboard-fridge':'sideboard-wall')},renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.toneMapping=THREE.ACESFilmicToneMapping;
 const scene=new THREE.Scene();scene.background=new THREE.Color('#fcfaf7');scene.add(new THREE.HemisphereLight(0xffffff,0xb0a393,2.3));const light=new THREE.DirectionalLight(0xffead6,2.3);light.position.set(-2,4,4);scene.add(light);
 const camera=new THREE.PerspectiveCamera(33,1,.01,30);camera.position.set(2.6,1.9,5.6);const controls=new OrbitControls(camera,canvas);controls.target.set(0,1.2,0);controls.update();
 let model=FurnishCabinetModel.build(THREE,f,box);scene.add(model);scene.add(box(4,.015,4,'#e1d5c4',0,-.016,0));
 const render=()=>{renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);};controls.addEventListener('change',render);window.addEventListener('resize',render);render();
 views.push({f,camera,controls,render,rebuild(){scene.remove(model);model.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});model=FurnishCabinetModel.build(THREE,f,box);scene.add(model);render();}});
}
document.querySelector('#doors').onclick=()=>views.forEach(v=>{v.f.cabinet.columns.forEach(c=>{c.doorOpen=!c.doorOpen;if(c.doorSections)Object.values(c.doorSections).forEach(state=>state.open=c.doorOpen);});v.rebuild();});let front=false;document.querySelector('#front').onclick=()=>{front=!front;views.forEach(v=>{v.camera.position.set(front?0:2.6,front?1.22:1.9,front?6.2:5.6);v.controls.update();v.render();});};document.querySelector('#drawers').onclick=()=>views.forEach(v=>{v.f.cabinet.columns.forEach(col=>col.drawers.forEach(d=>{d.open=!d.open;d.lanes?.forEach(state=>state.open=d.open);}));v.rebuild();});
 document.querySelector('#drawer-height').onchange=e=>{try{const next=views.map(v=>FurnishCabinet.setSideboardDrawerHeight(v.f,Number(e.target.value)));views.forEach((v,i)=>{Object.assign(v.f,next[i]);v.rebuild();});document.querySelector('#error').textContent='';}catch(err){document.querySelector('#error').textContent=err.message;}};
 document.querySelector('#display').onclick=()=>views.forEach(v=>{for(const group of FurnishCabinet.sideboardDisplayGroups(v.f)){const col=v.f.cabinet.columns[group.column];col.displayOpen=!col.displayOpen;}v.rebuild();});document.querySelector('#fridge-depth').onchange=e=>{try{Object.assign(views[1].f,FurnishCabinet.setSideboardFridgeDepth(views[1].f,Number(e.target.value)));views[1].rebuild();document.querySelectorAll('article h2')[1].textContent='带左侧冰箱位 · '+views[1].f.w+' × '+views[1].f.d+' × '+views[1].f.h+' mm';document.querySelector('#error').textContent='';}catch(err){document.querySelector('#error').textContent=err.message;}};for(const section of ['upper','lower'])document.querySelector('#'+section+'-doors').onclick=()=>views.forEach(v=>{for(let i=0;i<v.f.cabinet.columns.length;i++)if(FurnishCabinet.splitDoors(v.f.cabinet,v.f.cabinet.columns[i]))Object.assign(v.f,FurnishCabinet.toggle(v.f,i,undefined,false,undefined,section));v.rebuild();});window.previewReady=true;
</script></html>
